name: CI

# En las ramas que se publican, CI corre desde publicar.yml (antes de
# publicar); acá no se repite.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # typegen primero: LayoutProps y PageProps son tipos que genera Next.js,
      # y sin build previo no existen.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  procesador:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: procesador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Migraciones + permisos por fila contra un Postgres de verdad.
  base:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: supabase/pruebas/correr.sh

  # Las funciones que corren en Supabase (la lectura de comprobantes).
  funciones:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno fmt --check .
      - run: deno check --no-lock leer/index.ts drive/index.ts
      # exceljs (la hoja de Drive) lee variables de entorno y sus plantillas.
      - run: deno test --no-lock --allow-env --allow-read
